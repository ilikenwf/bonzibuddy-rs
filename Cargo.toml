[package]
name = "bonzibuddy-rs"
version = "1.0.0"
edition = "2021"
description = "A safe, offline, cross-platform reimplementation of the 1999 BonziBuddy desktop companion. Zero network code."
license = "MIT"

[dependencies]
winit = "0.30"
pixels = "0.17"
# GL backend keeps wgpu working on ancient/virtualized drivers (and lavapipe-free
# software rendering); feature-unified into pixels' wgpu.
wgpu = { version = "29", default-features = false, features = ["gles"] }
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
rodio = { version = "0.20", default-features = false, features = ["wav"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.9"
ab_glyph = "0.2"
cpal = { version = "0.15", features = ["jack"], optional = true }
libc = "0.2"
raw-window-handle = "0.6"
tray-icon = "0.19"
# Optional agent chat (Settings dialog). Only ever contacted when the user
# configures an endpoint; the offline pet never touches the network.
ureq = { version = "2", default-features = false, features = ["json"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Only used to XSetInputFocus our override-redirect window while a dialog
# is open (the WM will never focus an unmanaged window).
x11rb = "0.13"
gtk = "0.18"

[features]
default = ["audio"]
# Wav sound effects via rodio/cpal. Disable for headless builds or when
# cross-checking aarch64-apple-darwin from Linux (coreaudio-sys needs the
# macOS SDK at build time; native macOS builds keep audio on).
audio = ["dep:rodio", "dep:cpal"]

[profile.release]
opt-level = 2
